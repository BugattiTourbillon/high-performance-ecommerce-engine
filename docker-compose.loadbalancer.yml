version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app1:
    build: .
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: ecommerce
      SPRING_DATASOURCE_PASSWORD: ecommerce
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-c3VwZXItc2VjdXJlLWxvYWQtYmFsYW5jZWQtZGV2LXNlY3JldC1jaGFuZ2UtbWU=}
      APP_ASYNC_CORE_POOL_SIZE: 8
      APP_ASYNC_MAX_POOL_SIZE: 16
      APP_ASYNC_QUEUE_CAPACITY: 200
      APP_CHECKOUT_MAX_CONCURRENT_PAYMENT_SIMULATIONS: 32
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app2:
    build: .
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: ecommerce
      SPRING_DATASOURCE_PASSWORD: ecommerce
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-c3VwZXItc2VjdXJlLWxvYWQtYmFsYW5jZWQtZGV2LXNlY3JldC1jaGFuZ2UtbWU=}
      APP_ASYNC_CORE_POOL_SIZE: 8
      APP_ASYNC_MAX_POOL_SIZE: 16
      APP_ASYNC_QUEUE_CAPACITY: 200
      APP_CHECKOUT_MAX_CONCURRENT_PAYMENT_SIMULATIONS: 32
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8088:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
