spring:
  datasource:
    url: jdbc:h2:mem:ecommerce;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cache:
    type: simple
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

management:
  health:
    redis:
      enabled: false

app:
  security:
    jwt-secret: c3VwZXItc2VjdXJlLXRlc3Qtc2VjcmV0LWNoYW5nZS1tZQ==
    token-ttl: PT2H
  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 20
    thread-name-prefix: commerce-test-
  checkout:
    max-concurrent-payment-simulations: 8
  monitoring:
    slow-call-threshold-ms: 50
  batch:
    daily-sales-cron: "0 0 1 * * *"
