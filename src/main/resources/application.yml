server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: high-performance-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${SPRING_DATASOURCE_USERNAME:ecommerce}
    password: ${SPRING_DATASOURCE_PASSWORD:ecommerce}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 30000
      connection-timeout: 10000
      max-lifetime: 1800000
      pool-name: ecommerce-hikari-pool
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: high-performance-engine

app:
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET:c3VwZXItc2VjdXJlLWRldmVsb3BtZW50LW9ubHktc2VjcmV0LWNoYW5nZS1tZQ==}
    token-ttl: ${APP_SECURITY_TOKEN_TTL:PT12H}
  async:
    core-pool-size: ${APP_ASYNC_CORE_POOL_SIZE:8}
    max-pool-size: ${APP_ASYNC_MAX_POOL_SIZE:16}
    queue-capacity: ${APP_ASYNC_QUEUE_CAPACITY:200}
    thread-name-prefix: commerce-async-
  checkout:
    max-concurrent-payment-simulations: ${APP_CHECKOUT_MAX_CONCURRENT_PAYMENT_SIMULATIONS:32}
  monitoring:
    slow-call-threshold-ms: 250
  batch:
    daily-sales-cron: "0 0 1 * * *"
